[project]
name = "leavepulse-sdk"
version = "0.0.0"
description = "Generated Python SDK for the LeavePulse platform API."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leavepulse_sdk"]
